<div class="main-layout">
  @if (isLargeScreen()) {
    <app-sidebar class="sidebar-wrapper"></app-sidebar>
  }

  <main class="main-content" [class.with-sidebar]="isLargeScreen()">
    <router-outlet></router-outlet>
  </main>

  @if (!isLargeScreen()) {
    <app-bottom-bar class="bottom-bar-wrapper"></app-bottom-bar>
  }
</div>
