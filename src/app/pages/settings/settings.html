<main class="settings-page">
  <h1>{{ 'settings.title' | translate }}</h1>

  <div class="settings-container">
    <mat-card class="settings-card">
      <mat-card-header>
        <mat-card-title>{{ 'settings.account' | translate }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-list>
          <mat-list-item>
            <mat-icon matListItemIcon>person</mat-icon>
            <span matListItemTitle>{{ getUser()?.displayName }}</span>
          </mat-list-item>
          <mat-list-item>
            <mat-icon matListItemIcon>email</mat-icon>
            <span matListItemTitle>{{ getUser()?.email }}</span>
          </mat-list-item>
        </mat-list>
      </mat-card-content>
      <mat-card-actions>
        <button mat-stroked-button routerLink="/settings/account">
          <mat-icon>edit</mat-icon>
          Editar
        </button>
      </mat-card-actions>
    </mat-card>

    <mat-card class="settings-card">
      <mat-card-header>
        <mat-card-title>{{ 'settings.session' | translate }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <button mat-raised-button color="warn" (click)="openLogoutConfirm()">
          <mat-icon>logout</mat-icon>
          {{ 'navigation.logout' | translate }}
        </button>
      </mat-card-content>
    </mat-card>
  </div>
</main>
