<main class="login-page">
    <article class="login-card">

        <header class="login-header">
            <img class="login-logo" src="assets/logo_clocknails.png" [alt]="'login.logoAlt' | translate" />
            <h1 class="login-title">{{ 'login.title' | translate }}</h1>
            <p class="login-subtitle">{{ 'login.subtitle' | translate }}</p>
        </header>

        <button mat-raised-button class="login-button" [disabled]="loading()" (click)="onLogin()">
            @if (loading()) {
            <mat-spinner diameter="22" />
            } @else {
            {{ 'login.button' | translate }}
            }
        </button>

    </article>
</main>
